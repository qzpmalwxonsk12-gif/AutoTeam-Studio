[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoteam-studio"
version = "0.1.0"
description = "Local two-Codex-account Windows desktop development studio"
readme = "START_HERE.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "PyInstaller>=6,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
